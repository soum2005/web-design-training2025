<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h2>Student Registration Form</h2>
    <form>
        <label>Name:</label>
        <input type="text" name="name"><br><br>

        <label>Email:</label>
        <input type="email" name="email"><br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female<br><br>

        <label>Select Skills: </label>
            <input type="checkbox" name="skill" value="web design"> WEB DESIGN
            <input type="checkbox" name="skill" value="web development"> WEB DEVELOPMENT
            <input type="checkbox" name="skill" value="full stack developer"> FULL STACK DEVELOPER<br><br>

        <label>Department:</label>
        <select>
            <option value="CSE">CSE</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="ME">ME</option>
        </select><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
